services:
  db:
    image: postgres:latest
    container_name: desafio-tecnico-one-db
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    env_file:
      - .env

volumes:
  pg-data:
