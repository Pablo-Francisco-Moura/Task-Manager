services:
  db:
    image: postgres:16
    container_name: desafio-tecnico-one-db
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    env_file:
      - .env

  app:
    build: .
    container_name: desafio-tecnico-one-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./:/app

volumes:
  pg-data:
